[package]
name = "process-execution-protocol"
version = "0.1.0"
edition.workspace = true
description = "Shared execution RPC types, dispatch, and batching"

[dependencies]
process-execution-core = { path = "../process-execution-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["serde", "v4"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
